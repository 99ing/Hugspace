<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>绿色未来 · 环境保护官网</title>

  <style>
    :root {
      --primary: #1b5e20;
      --secondary: #2e7d32;
      --accent: #4caf50;
      --bg-light: #f4f8f5;
      --text-main: #2c2c2c;
      --text-sub: #5a5a5a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      background-color: var(--bg-light);
      color: var(--text-main);
      line-height: 1.7;
    }

    /* ===== 顶部导航 ===== */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      z-index: 1000;
    }

    .nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 1px;
    }

    .nav ul {
      list-style: none;
      display: flex;
      gap: 28px;
    }

    .nav a {
      text-decoration: none;
      font-size: 0.95rem;
      color: var(--text-main);
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .nav a:hover {
      color: var(--accent);
    }

    /* ===== 首屏横幅 ===== */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 20px 80px;
      background:
        linear-gradient(135deg, rgba(27, 94, 32, 0.85), rgba(46, 125, 50, 0.85)),
        radial-gradient(circle at top, #c8e6c9, transparent 60%);
      color: #ffffff;
      text-align: center;
    }

    .hero-content {
      max-width: 900px;
    }

    .hero h1 {
      font-size: clamp(2.6rem, 5vw, 3.8rem);
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: 2px;
    }

    .hero p {
      font-size: 1.15rem;
      max-width: 720px;
      margin: 0 auto 40px;
      opacity: 0.95;
    }

    .hero-btn {
      display: inline-block;
      padding: 14px 38px;
      border-radius: 50px;
      background: #ffffff;
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .hero-btn:hover {
      background: var(--accent);
      color: #ffffff;
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    }

    /* ===== 核心理念 ===== */
    section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 100px 20px;
    }

    section h2 {
      text-align: center;
      font-size: 2.2rem;
      color: var(--primary);
      margin-bottom: 60px;
      position: relative;
    }

    section h2::after {
      content: "";
      width: 90px;
      height: 4px;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      display: block;
      margin: 18px auto 0;
      border-radius: 2px;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 36px;
    }

    .feature-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.06);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .feature-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.1);
    }

    .feature-card span {
      font-size: 2.8rem;
      display: block;
      margin-bottom: 22px;
    }

    .feature-card h3 {
      font-size: 1.35rem;
      color: var(--secondary);
      margin-bottom: 14px;
    }

    .feature-card p {
      font-size: 0.95rem;
      color: var(--text-sub);
    }

    /* ===== 页脚 ===== */
    footer {
      background: #e8f5e9;
      padding: 40px 20px;
      text-align: center;
      font-size: 0.9rem;
      color: #3f6b45;
    }

    footer strong {
      color: var(--primary);
    }
  </style>
</head>
<body>

  <!-- 顶部导航 -->
  <header>
    <div class="nav">
      <div class="logo">绿色未来</div>
      <ul>
        <li><a href="#">首页</a></li>
        <li><a href="#">环保理念</a></li>
        <li><a href="#">行动方案</a></li>
        <li><a href="#">关于我们</a></li>
      </ul>
    </div>
  </header>

  <!-- 首屏 -->
  <section class="hero">
    <div class="hero-content">
      <h1>守护自然 · 共建绿色未来</h1>
      <p>
        环境保护不仅是一项责任，更是一种面向未来的选择。
        让低碳、可持续与尊重自然，成为社会发展的共同方向。
      </p>
      <a href="#" class="hero-btn">了解我们的行动</a>
    </div>
  </section>

  <!-- 核心内容 -->
  <section>
    <h2>我们的环保使命</h2>
    <div class="features">
      <div class="feature-card">
        <span>🌱</span>
        <h3>可持续发展</h3>
        <p>在经济、社会与生态之间建立长期平衡，为后代保留发展空间。</p>
      </div>
      <div class="feature-card">
        <span>💧</span>
        <h3>资源高效利用</h3>
        <p>节约水资源与能源，减少浪费，让有限资源发挥最大价值。</p>
      </div>
      <div class="feature-card">
        <span>🌍</span>
        <h3>生态系统保护</h3>
        <p>保护森林、海洋与生物多样性，维护地球生态安全。</p>
      </div>
    </div>
  </section>

  <!-- 页脚 -->
  <footer>
    <p>© 2025 绿色未来 · 环境保护官方网站</p>
    <p><strong>没有地球，就没有未来</strong></p>
  </footer>

</body>
</html>
